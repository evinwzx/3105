name: Construir aplicativo iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Compilar o projeto (Sem assinatura formal)
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
                     -scheme "3105" \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Organizar os ficheiros para gerar o IPA
        run: |
          mkdir -p Payload
          cp -r $(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1) Payload/
          zip -r ThreeOneOSFive.ipa Payload

      - name: Enviar o IPA como artefato de download
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive-IPA
          path: ThreeOneOSFive.ipa
